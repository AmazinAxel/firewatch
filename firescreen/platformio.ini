; Firescreen — dashboard for the TRMNL OG DIY Kit
; (Seeed XIAO ESP32-S3 Plus + 7.5" 800x480 e-ink).
;
; Secrets/config come from a gitignored `.env` (see .env.example); they are
; injected as -D defines by scripts/load_env.py before every build.
;
; Host tooling (gcc for `pio test -e native`, preview/asset-gen deps) is
; provided by the flake: `nix develop`.

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/load_env.py
build_flags =
    -Wall
    -Wextra
    ; USB CDC serial on the XIAO's USB-C port (used for logs + fake-data test mode)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    bblanchon/ArduinoJson@^7.4.2

; Host-side unit tests for the pure-logic modules (AQI math, stream parser,
; chart scaling). Requires a host C++ compiler. Run: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
lib_compat_mode = off
test_build_src = no
