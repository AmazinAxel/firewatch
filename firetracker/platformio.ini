; Firetracker — SDS011 particulate sensor node on an ESP32-C3 Super Mini,
; battery + solar powered, reporting to the homelab endpoint.

[env:esp32-c3-supermini]
platform = platformio/espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 9600

# MUST ENABLE THIS BELOW FOR SERIAL CONSOLE TO WORK
# build_flags =
# 	-D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
	lewapek/Nova Fitness Sds dust sensors library@^1.5.1
